<!-- 
Exemplo de código HTML para inserir no Joomla
Cole este código em um Artigo ou Módulo Custom HTML
-->

<!-- Versão Básica -->
<div class="dashboard-container">
    <iframe 
        src="http://seu-servidor:8050" 
        width="100%" 
        height="800px" 
        frameborder="0"
        style="border: none; min-height: 800px;"
        allowfullscreen>
        <p>Seu navegador não suporta iframes. 
        <a href="http://seu-servidor:8050" target="_blank">Acesse o dashboard diretamente</a>.</p>
    </iframe>
</div>

<!-- Versão Responsiva (Recomendada) -->
<div class="dashboard-responsive" style="position: relative; width: 100%; padding-bottom: 75%; height: 0; overflow: hidden; background: #f5f5f5;">
    <iframe 
        src="http://seu-servidor:8050" 
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
        allowfullscreen
        loading="lazy"
        title="Dashboard de Ondas de Calor">
    </iframe>
</div>

<!-- Versão com Loading (Opcional) -->
<div class="dashboard-wrapper" style="position: relative; width: 100%; min-height: 800px;">
    <div id="dashboard-loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;">
        <p>Carregando dashboard...</p>
    </div>
    <iframe 
        id="dashboard-frame"
        src="http://seu-servidor:8050" 
        width="100%" 
        height="800px" 
        frameborder="0"
        style="border: none; opacity: 0; transition: opacity 0.3s;"
        allowfullscreen
        onload="document.getElementById('dashboard-loading').style.display='none'; document.getElementById('dashboard-frame').style.opacity='1';">
    </iframe>
</div>

<!-- CSS Adicional (Adicione no template do Joomla ou Custom CSS) -->
<style>
.dashboard-container {
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
    overflow: hidden;
}

.dashboard-responsive {
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
}

/* Responsividade */
@media (max-width: 768px) {
    .dashboard-container iframe,
    .dashboard-responsive {
        height: 600px;
        padding-bottom: 100%;
    }
}
</style>

<!-- JavaScript para ajuste automático de altura (Opcional) -->
<script>
(function() {
    var iframe = document.querySelector('.dashboard-container iframe, .dashboard-responsive iframe');
    if (iframe) {
        function adjustHeight() {
            try {
                var height = iframe.contentWindow.document.body.scrollHeight;
                iframe.style.height = height + 'px';
            } catch (e) {
                // Cross-origin, não é possível ajustar automaticamente
            }
        }
        
        iframe.onload = function() {
            adjustHeight();
            setInterval(adjustHeight, 1000);
        };
    }
})();
</script>
